name: Bump patch on main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codexerrand-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    if: >-
      ${{ !startsWith(github.event.head_commit.message || '', 'chore(release): v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require PAT when publishing is enabled
        if: ${{ vars.AUTO_PUBLISH_NPM == 'true' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            exit 0
          fi
          echo "AUTO_PUBLISH_NPM=true requires GH_PAT so the release commit can trigger publish-npm.yml."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: npm version patch --no-git-tag-version
      - run: node scripts/sync-version.mjs

      - name: Commit release version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          version=$(node -p "require('./package.json').version")
          git add package.json package-lock.json .codex-plugin/plugin.json
          git commit -m "chore(release): v${version}"
          git push origin HEAD:main
